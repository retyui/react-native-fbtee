name: Build Android App

on:
  push:
    branches:
      - main
    paths: &build_paths
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build_android.yaml'
  pull_request:
    paths: *build_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_app:
    strategy:
      fail-fast: false
      matrix:
        new_arch_enabled: [1]
        rn_ver: [latest]

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Tmp React Native App
        uses: retyui/oss-react-native-build/build-app@v1
        with:
          platform: android
          rn-ver: ${{ matrix.rn_ver }}
          new-arch-enabled: ${{ matrix.new_arch_enabled }}
          android-arch: x86_64
