name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push tags and create the GitHub release
  pull-requests: write # open the "chore: version packages" PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages # changeset version && yarn install
          publish-script: yarn release # changeset publish (build runs via prepublishOnly)
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
